<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - FutureMaker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="coursesncareers.css">
</head>
<body>
    <!-- Logo Header -->
    <header>
        <a href="index.html" class="logo-link"><img src="Assets/Logo.png" alt="FutureMaker logo" class="site-logo"></a>
    </header>

    <!-- Navigation Bar -->
    <nav class="topnav" id="myTopnav">
        <div id="myLinks">
            <a href="quiz.html">Quiz</a>
            <a href="careers.html">Careers</a>
            <a href="courses.html" class="active">Courses</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <form class="nav-search" novalidate>
                <input type="search" placeholder="Search...">
                <button type="submit">&#x2315;</button>
            </form>
        </div>
        <button class="icon" type="button" onclick="myFunction()">
        </button>
    </nav>

    <!-- Hero -->
    <section class="courses-hero">
        <h2>Courses</h2>
        <p>Discover our range of courses designed to equip you with the skills needed for a successful career.</p>
    </section>
    <img src="Assets/swirl.svg" alt="Decorative swirl" class="decorative-swirl">

    <!-- Main Content -->
    <main>
        <div class="container">
            <a class="item" href="subpage.html">
                <span>Business</span>
                <img src="Assets/Business.png" alt="Business">
            </a>
            <a class="item" href="subpage.html">
                <span>Arts</span>
                <img src="Assets/Art.png" alt="Arts">
            </a>
            <a class="item" href="subpage.html">
                <span>Agriculture</span>
                <img src="Assets/Agriculture.png" alt="Agriculture">
            </a>
            <a class="item" href="subpage.html">
                <span>Science</span>
                <img src="Assets/Science.jpg" alt="Science">
            </a>
            <a class="item" href="subpage.html">
                <span>Humanities</span>
                <img src="Assets/Humanities.png" alt="Humanities">
            </a>
            <a class="item" href="subpage.html">
                <span>Engineering</span>
                <img src="Assets/Engineer.png" alt="Engineering">
            </a>
        </div>
    </main>
    
    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>Stay in contact?</p>
            <form class="footer-form" novalidate>
                <input type="email" name="email" id="footer-email" placeholder="your.email@example.com" required>
                <button type="submit">Subscribe</button>
                <div class="footer-feedback"></div>
            </form>
            <p>&copy; 2026 FutureMaker. All rights reserved.</p>
        </div>
        <div class="footer-phone" aria-label="Phone contact">
            <img src="Assets/Phone.png" alt="Phone icon">
            <span>01 234 567 89</span>
        </div>
        <div class="footer-social" aria-label="Social media links">
            <a href="https://www.instagram.com" target="_blank">
                <img src="Assets/instagram.png" alt="Instagram">
            </a>
            <a href="https://www.facebook.com" target="_blank">
                <img src="Assets/facebook.png" alt="Facebook">
            </a>
            <a href="https://www.tiktok.com" target="_blank">
                <img src="Assets/tiktok.png" alt="TikTok">
            </a>
        </div>
    </footer>

    <script src="js/footer.js"></script>
